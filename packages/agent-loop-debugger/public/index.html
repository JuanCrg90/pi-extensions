<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Loop Debugger</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c0f;
      --surface: #15171c;
      --surface-hover: #1e2028;
      --border: #2a2d36;
      --text: #e6e6e6;
      --text-muted: #9aa0a6;
      --accent: #7ee787;
      --danger: #f28b82;
      --warning: #fdd663;
      --category-session: #c58af9;
      --category-agent: #79c0ff;
      --category-prompt: #ffd60a;
      --category-tool: #7ee787;
      --category-provider: #ffa657;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      color: var(--accent);
    }

    .title::before {
      content: "";
      display: inline-block;
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: currentColor;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .category-toggle {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 0.35rem 0.6rem;
      border-radius: 0.35rem;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.15s, border-color 0.15s;
    }

    .category-toggle:hover {
      background: var(--surface-hover);
    }

    .category-toggle[data-category="session"] { --cat: var(--category-session); }
    .category-toggle[data-category="agent"]   { --cat: var(--category-agent); }
    .category-toggle[data-category="prompt"]  { --cat: var(--category-prompt); }
    .category-toggle[data-category="tool"]    { --cat: var(--category-tool); }
    .category-toggle[data-category="provider"]{ --cat: var(--category-provider); }

    .category-toggle::before {
      content: "";
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--cat);
    }

    .category-toggle.hidden {
      opacity: 0.45;
      border-style: dashed;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0.35rem 0.7rem;
      border-radius: 0.35rem;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: background 0.15s;
    }

    .btn:hover {
      background: var(--surface-hover);
    }

    .btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Filters bar */
    .filters-bar {
      padding: 0.5rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      align-items: center;
      font-size: 0.85rem;
    }

    .filters-bar input[type="search"],
    .filters-bar select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 0.35rem 0.55rem;
      font-size: 0.8rem;
      font-family: var(--font-sans);
    }

    .filters-bar input[type="search"] {
      min-width: 12rem;
    }

    .filters-bar select {
      appearance: auto;
    }

    .spacer {
      flex: 1;
    }

    .types-dropdown {
      position: relative;
    }

    .types-popover {
      position: absolute;
      top: calc(100% + 0.35rem);
      right: 0;
      min-width: 14rem;
      max-height: 60vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 0.5rem;
      z-index: 20;
      display: none;
    }

    .types-popover:not(.hidden) {
      display: block;
    }

    .types-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .type-option {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text);
      padding: 0.15rem 0;
    }

    .type-option input {
      margin: 0;
    }

    .type-option .type-count {
      color: var(--text-muted);
      margin-left: auto;
      font-size: 0.75rem;
      font-family: var(--font-mono);
    }

    .type-empty {
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 0.25rem 0;
    }

    .traces-dropdown {
      position: relative;
    }

    .traces-popover {
      position: absolute;
      top: calc(100% + 0.35rem);
      right: 0;
      min-width: 16rem;
      max-height: 60vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 0.5rem;
      z-index: 20;
      display: none;
    }

    .traces-popover:not(.hidden) {
      display: block;
    }

    .traces-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .trace-option {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text);
      padding: 0.35rem 0.45rem;
      border-radius: 0.25rem;
      background: transparent;
      border: none;
      text-align: left;
      width: 100%;
    }

    .trace-option:hover {
      background: var(--surface-hover);
    }

    .trace-option .trace-name {
      font-weight: 500;
    }

    .trace-option .trace-meta {
      color: var(--text-muted);
      font-size: 0.72rem;
      font-family: var(--font-mono);
    }

    .trace-empty {
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 0.25rem 0;
    }

    .event-origin {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      padding: 0.1rem 0.35rem;
      white-space: nowrap;
      cursor: help;
    }

    .origin-filter {
      display: none;
    }

    .origin-filter.visible {
      display: block;
    }

    .herdr-indicator {
      display: none;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .herdr-indicator.visible {
      display: inline-flex;
    }

    .herdr-indicator::before {
      content: "";
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--accent);
    }

    /* State inspector panel */
    .state-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(90vw, 32rem);
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateX(0);
      transition: transform 0.2s ease;
    }

    .state-panel.hidden {
      display: none;
    }

    .state-panel-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .state-panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .state-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.15rem 0.35rem;
    }

    .state-close:hover {
      color: var(--text);
    }

    .state-tabs {
      display: flex;
      gap: 0.25rem;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .state-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.35rem 0.6rem;
      border-radius: 0.35rem;
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .state-tab:hover {
      background: var(--surface-hover);
    }

    .state-tab.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .state-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 1rem;
    }

    .state-pane {
      display: none;
    }

    .state-pane.active {
      display: block;
    }

    .state-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin: 0 0 0.5rem;
    }

    .state-prompt-wrap {
      position: relative;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 0.75rem;
    }

    .state-prompt-wrap pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      line-height: 1.5;
      max-height: 70vh;
      overflow-y: auto;
    }

    .copy-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 0.3rem;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .tools-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .tool-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 0.6rem 0.75rem;
    }

    .tool-name {
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tool-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.1rem 0.35rem;
      border-radius: 0.2rem;
      background: rgba(126, 231, 135, 0.15);
      color: var(--accent);
    }

    .tool-badge.inactive {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .tool-desc {
      margin: 0.25rem 0 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .context-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .context-metric {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 0.6rem;
      text-align: center;
    }

    .context-metric-value {
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    .context-metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .progress-track {
      height: 0.5rem;
      background: var(--bg);
      border-radius: 0.25rem;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s;
    }

    .state-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 40;
      display: none;
    }

    .state-backdrop.visible {
      display: block;
    }

    /* Status bar */
    .status-bar {
      padding: 0.5rem 1.25rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 1rem;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.connecting { background: var(--warning); }
    .status-dot.connected  { background: var(--accent); }
    .status-dot.error      { background: var(--danger); }

    .category-counts {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .category-count {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .category-count::before {
      content: "";
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--cat);
    }

    .category-count[data-category="session"]  { --cat: var(--category-session); }
    .category-count[data-category="agent"]    { --cat: var(--category-agent); }
    .category-count[data-category="prompt"]   { --cat: var(--category-prompt); }
    .category-count[data-category="tool"]     { --cat: var(--category-tool); }
    .category-count[data-category="provider"] { --cat: var(--category-provider); }

    /* Timeline */
    #timeline {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 1.25rem;
      scroll-behavior: smooth;
    }

    .event-row {
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      overflow: hidden;
      background: var(--surface);
      transition: border-color 0.15s;
    }

    .event-row:hover {
      border-color: #3c404d;
    }

    .event-row.expanded {
      border-color: #3c404d;
    }

    .event-row.compact-group {
      border-style: dashed;
    }

    .event-row.compact-group.expanded {
      border-style: solid;
    }

    .event-header {
      display: grid;
      grid-template-columns: auto auto auto auto 1fr auto auto;
      gap: 0.6rem 0.75rem;
      align-items: center;
      padding: 0.6rem 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    .event-timestamp {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 5.5rem;
    }

    .event-latency,
    .event-size {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .event-size {
      text-align: right;
    }

    .event-category {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      background: rgba(255, 255, 255, 0.08);
      color: var(--cat);
      white-space: nowrap;
    }

    .event-row[data-category="session"]  { --cat: var(--category-session); }
    .event-row[data-category="agent"]    { --cat: var(--category-agent); }
    .event-row[data-category="prompt"]   { --cat: var(--category-prompt); }
    .event-row[data-category="tool"]     { --cat: var(--category-tool); }
    .event-row[data-category="provider"] { --cat: var(--category-provider); }

    .event-type {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 16rem;
    }

    .event-summary {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .expand-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0 0.2rem;
      line-height: 1;
    }

    .expand-btn:hover {
      color: var(--text);
    }

    .event-payload {
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 0.85rem;
      overflow-x: auto;
    }

    .event-payload pre {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .group-payload {
      padding: 0.5rem;
    }

    .nested-event {
      margin-bottom: 0.25rem;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
    }

    .nested-event:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .nested-event .event-header {
      padding: 0.45rem 0.6rem;
    }

    .json-key         { color: #79c0ff; }
    .json-string       { color: #a5d6ff; }
    .json-number       { color: #79c0ff; }
    .json-bool         { color: #56d364; }
    .json-null         { color: #ff7b72; }
    .json-punctuation  { color: #c9d1d9; }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      font-size: 0.9rem;
    }

    .empty-state.hidden {
      display: none;
    }

    /* Scroll-to-bottom hint */
    .scroll-hint {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.35rem;
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
    }

    .scroll-hint.visible {
      display: block;
    }

    @media (max-width: 800px) {
      .event-header {
        grid-template-columns: auto 1fr;
        gap: 0.4rem 0.75rem;
      }
      .event-summary {
        grid-column: 1 / -1;
      }
      .category-counts {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Agent Loop Debugger</div>
    <div class="controls">
      <button class="category-toggle" data-category="session">session</button>
      <button class="category-toggle" data-category="agent">agent</button>
      <button class="category-toggle" data-category="prompt">prompt</button>
      <button class="category-toggle" data-category="tool">tool</button>
      <button class="category-toggle" data-category="provider">provider</button>
      <button class="btn" id="autoscroll-toggle" title="Pause/resume auto-scroll">Auto-scroll: on</button>
      <button class="btn" id="state-toggle" title="Open state inspector">State</button>
      <button class="btn" id="clear-btn" title="Clear the timeline display">Clear</button>
    </div>
  </header>

  <div class="filters-bar">
    <input type="search" id="search-input" placeholder="Search type, summary, payload…" />
    <select id="time-range" title="Show events within a time window">
      <option value="all">All time</option>
      <option value="30s">Last 30 seconds</option>
      <option value="1m">Last 1 minute</option>
      <option value="5m">Last 5 minutes</option>
    </select>
    <button class="btn active" id="compact-toggle" title="Collapse consecutive message_update deltas">Compact deltas: on</button>
    <div class="types-dropdown">
      <button class="btn" id="types-toggle">Event types ▾</button>
      <div id="types-popover" class="types-popover hidden">
        <div class="types-list" id="types-list">
          <div class="type-empty">No events yet</div>
        </div>
      </div>
    </div>
    <div class="traces-dropdown">
      <button class="btn" id="traces-toggle">Load trace ▾</button>
      <div id="traces-popover" class="traces-popover hidden">
        <div class="traces-list" id="traces-list">
          <div class="trace-empty">No saved traces</div>
        </div>
      </div>
    </div>
    <select id="origin-filter" class="origin-filter" title="Filter by Herdr origin pane">
      <option value="all">All origins</option>
    </select>
    <div class="spacer"></div>
    <select id="export-format" title="Export format">
      <option value="json">JSON</option>
      <option value="html">HTML (self-contained)</option>
      <option value="markdown">Markdown</option>
    </select>
    <button class="btn" id="export-btn" title="Download filtered events">Export</button>
  </div>

  <div class="status-bar">
    <span class="status-dot connecting" id="status-dot"></span>
    <span id="status-text">Connecting…</span>
    <span id="event-count">0 events</span>
    <span id="herdr-indicator" class="herdr-indicator hidden" title="Herdr origin of latest event"></span>
    <div class="category-counts" id="category-counts"></div>
  </div>

  <div id="timeline">
    <div class="empty-state" id="empty-state">Waiting for events…</div>
  </div>

  <div class="scroll-hint" id="scroll-hint">New events below ↓</div>

  <div class="state-backdrop" id="state-backdrop"></div>

  <div id="state-panel" class="state-panel hidden">
    <div class="state-panel-header">
      <h3>State inspector</h3>
      <button class="state-close" id="state-close" title="Close state inspector">×</button>
    </div>
    <div class="state-tabs">
      <button class="state-tab active" data-tab="system-prompt">System prompt</button>
      <button class="state-tab" data-tab="tools">Tools</button>
      <button class="state-tab" data-tab="context">Context</button>
    </div>
    <div class="state-content">
      <div id="state-pane-system-prompt" class="state-pane active">
        <p class="state-section-title">Current effective system prompt</p>
        <div class="state-prompt-wrap">
          <button class="copy-btn" id="copy-system-prompt" title="Copy to clipboard">Copy</button>
          <pre id="system-prompt-text">No system prompt captured yet.</pre>
        </div>
      </div>
      <div id="state-pane-tools" class="state-pane">
        <p class="state-section-title">Active tools</p>
        <ul class="tools-list" id="tools-list">
          <li class="trace-empty">No tool information available.</li>
        </ul>
      </div>
      <div id="state-pane-context" class="state-pane">
        <p class="state-section-title">Context usage</p>
        <div class="context-metrics">
          <div class="context-metric">
            <div class="context-metric-value" id="context-tokens">—</div>
            <div class="context-metric-label">Tokens</div>
          </div>
          <div class="context-metric">
            <div class="context-metric-value" id="context-window">—</div>
            <div class="context-metric-label">Window</div>
          </div>
          <div class="context-metric">
            <div class="context-metric-value" id="context-percent">—</div>
            <div class="context-metric-label">Percent</div>
          </div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="context-progress"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const timeline = document.getElementById("timeline");
    const emptyState = document.getElementById("empty-state");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const eventCountLabel = document.getElementById("event-count");
    const categoryCountsEl = document.getElementById("category-counts");
    const autoscrollBtn = document.getElementById("autoscroll-toggle");
    const exportBtn = document.getElementById("export-btn");
    const exportFormat = document.getElementById("export-format");
    const clearBtn = document.getElementById("clear-btn");
    const scrollHint = document.getElementById("scroll-hint");
    const searchInput = document.getElementById("search-input");
    const timeRangeSelect = document.getElementById("time-range");
    const compactToggle = document.getElementById("compact-toggle");
    const typesToggle = document.getElementById("types-toggle");
    const typesPopover = document.getElementById("types-popover");
    const typesList = document.getElementById("types-list");
    const tracesToggle = document.getElementById("traces-toggle");
    const tracesPopover = document.getElementById("traces-popover");
    const tracesList = document.getElementById("traces-list");
    const stateToggle = document.getElementById("state-toggle");
    const statePanel = document.getElementById("state-panel");
    const stateBackdrop = document.getElementById("state-backdrop");
    const stateClose = document.getElementById("state-close");
    const systemPromptText = document.getElementById("system-prompt-text");
    const copySystemPrompt = document.getElementById("copy-system-prompt");
    const toolsList = document.getElementById("tools-list");
    const contextTokens = document.getElementById("context-tokens");
    const contextWindow = document.getElementById("context-window");
    const contextPercent = document.getElementById("context-percent");
    const contextProgress = document.getElementById("context-progress");
    const stateTabs = document.querySelectorAll(".state-tab");
    const statePanes = document.querySelectorAll(".state-pane");
    const originFilter = document.getElementById("origin-filter");
    const herdrIndicator = document.getElementById("herdr-indicator");

    const allEvents = [];
    const visibleCategories = new Set(["session", "agent", "prompt", "tool", "provider"]);
    const visibleTypes = new Set();
    const hiddenTypes = new Set();
    const typeCounts = new Map();
    const discoveredPaneIds = new Set();
    const itemElements = new Map();
    const expandedEventIds = new Set();
    const expandedGroupIds = new Set();

    let autoScroll = true;
    let searchQuery = "";
    let searchTimer = null;
    let timeRange = "all";
    let compactDeltas = true;
    let selectedOriginPane = "all";
    let lastScrollHeight = 0;
    let renderScheduled = false;

    const events = new EventSource("/events");

    function setStatus(state, text) {
      statusDot.className = "status-dot " + state;
      statusText.textContent = text;
    }

    function formatTime(timestamp) {
      const d = new Date(timestamp);
      const pad = (n) => String(n).padStart(2, "0");
      const ms = String(d.getMilliseconds()).padStart(3, "0");
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${ms}`;
    }

    function formatLatency(ms) {
      if (ms == null) return "";
      if (ms < 1000) return `+${Math.round(ms)}ms`;
      return `+${(ms / 1000).toFixed(1)}s`;
    }

    function formatBytes(n) {
      if (n < 1024) return `${n} B`;
      return `${(n / 1024).toFixed(1)} KB`;
    }

    function formatHerdrOrigin(origin) {
      if (!origin) return "";
      const parts = [];
      if (origin.workspaceId) parts.push(`w${origin.workspaceId}`);
      if (origin.tabId) parts.push(`t${origin.tabId}`);
      if (origin.paneId) parts.push(`p${origin.paneId}`);
      return parts.join(":");
    }

    function formatHerdrTooltip(origin) {
      if (!origin) return "";
      const lines = [];
      if (origin.paneId) lines.push(`Pane: ${origin.paneId}`);
      if (origin.tabId) lines.push(`Tab: ${origin.tabId}`);
      if (origin.workspaceId) lines.push(`Workspace: ${origin.workspaceId}`);
      return lines.join("\n");
    }

    function shortenPaneId(paneId) {
      if (!paneId) return "?";
      if (paneId.length <= 8) return paneId;
      return paneId.slice(0, 6) + "…";
    }

    function originBadgeHtml(event) {
      if (!event?.origin?.paneId) return "";
      const label = escapeHtml(shortenPaneId(event.origin.paneId));
      const tooltip = escapeHtml(formatHerdrTooltip(event.origin));
      return `<span class="event-origin" title="${tooltip}">${label}</span>`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeMd(str) {
      return String(str).replace(/\|/g, "\\|").replace(/\n/g, " ");
    }

    function appendTextNode(parent, text) {
      parent.appendChild(document.createTextNode(text));
    }

    function appendSpan(parent, className, text) {
      const span = document.createElement("span");
      span.className = className;
      span.textContent = text;
      parent.appendChild(span);
    }

    function renderJsonPayload(container, json) {
      let str;
      try {
        str = JSON.stringify(json, null, 2);
      } catch {
        str = "[unstringifiable]";
      }

      const pre = document.createElement("pre");
      let i = 0;

      while (i < str.length) {
        const ch = str[i];

        // String literal
        if (ch === '"') {
          let end = i + 1;
          while (end < str.length) {
            if (str[end] === '\\' && end + 1 < str.length) {
              end += 2;
            } else if (str[end] === '"') {
              end++;
              break;
            } else {
              end++;
            }
          }
          const token = str.slice(i, end);
          const nextNonSpace = str.slice(end).match(/^\s*/);
          const isKey = str[end + (nextNonSpace ? nextNonSpace[0].length : 0)] === ":";
          appendSpan(pre, isKey ? "json-key" : "json-string", token);
          i = end;
          continue;
        }

        // Number
        if (/[-\d]/.test(ch)) {
          const match = str.slice(i).match(/^-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/);
          if (match) {
            appendSpan(pre, "json-number", match[0]);
            i += match[0].length;
            continue;
          }
        }

        // true / false / null
        const wordMatch = str.slice(i).match(/^(true|false|null)\b/);
        if (wordMatch) {
          const cls = wordMatch[1] === "null" ? "json-null" : "json-bool";
          appendSpan(pre, cls, wordMatch[0]);
          i += wordMatch[0].length;
          continue;
        }

        // Punctuation
        if (/[{}\[\],:]/.test(ch)) {
          appendSpan(pre, "json-punctuation", ch);
          i++;
          continue;
        }

        // Whitespace / anything else
        appendTextNode(pre, ch);
        i++;
      }

      container.innerHTML = "";
      container.appendChild(pre);
    }

    function isNearBottom() {
      const threshold = 60;
      return timeline.scrollHeight - timeline.scrollTop - timeline.clientHeight < threshold;
    }

    function scrollToBottom() {
      timeline.scrollTop = timeline.scrollHeight;
      lastScrollHeight = timeline.scrollHeight;
    }

    function updateScrollHint() {
      if (!autoScroll && !isNearBottom()) {
        scrollHint.classList.add("visible");
      } else {
        scrollHint.classList.remove("visible");
      }
    }

    function augmentEvent(event) {
      let payloadString;
      try {
        payloadString = JSON.stringify(event.payload);
      } catch {
        payloadString = "";
      }
      const payloadSize = new TextEncoder().encode(payloadString).length;
      const latency = allEvents.length > 0 ? event.timestamp - allEvents[allEvents.length - 1].timestamp : null;
      return { ...event, _payloadString: payloadString, payloadSize, latency };
    }

    function discoverType(type) {
      const existed = typeCounts.has(type);
      typeCounts.set(type, (typeCounts.get(type) || 0) + 1);
      if (!existed) {
        if (!hiddenTypes.has(type)) {
          visibleTypes.add(type);
        }
        renderTypeFilter();
      } else {
        updateTypeCount(type);
      }
    }

    function discoverOrigin(event) {
      const paneId = event.origin?.paneId;
      if (!paneId || discoveredPaneIds.has(paneId)) return;
      discoveredPaneIds.add(paneId);
      renderOriginFilter();
    }

    function renderOriginFilter() {
      if (discoveredPaneIds.size === 0) {
        originFilter.classList.remove("visible");
        return;
      }
      const previous = originFilter.value;
      originFilter.innerHTML = '<option value="all">All origins</option>';
      for (const paneId of Array.from(discoveredPaneIds).sort()) {
        const option = document.createElement("option");
        option.value = paneId;
        option.textContent = paneId;
        originFilter.appendChild(option);
      }
      originFilter.value = discoveredPaneIds.has(previous) ? previous : "all";
      selectedOriginPane = originFilter.value;
      originFilter.classList.add("visible");
    }

    function updateHerdrIndicator(event) {
      if (!event.origin) return;
      herdrIndicator.classList.add("visible");
      herdrIndicator.textContent = formatHerdrOrigin(event.origin);
      herdrIndicator.title = formatHerdrTooltip(event.origin);
    }

    function getTimeAnchor() {
      return allEvents.length > 0 ? allEvents[allEvents.length - 1].timestamp : Date.now();
    }

    function eventMatchesFilters(event, anchor = getTimeAnchor()) {
      if (!visibleCategories.has(event.category)) return false;
      if (!visibleTypes.has(event.type)) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        if (!event.type.toLowerCase().includes(q) &&
            !event.summary.toLowerCase().includes(q) &&
            !event._payloadString.toLowerCase().includes(q)) {
          return false;
        }
      }
      if (timeRange !== "all") {
        const windows = { "30s": 30000, "1m": 60000, "5m": 300000 };
        if (event.timestamp < anchor - windows[timeRange]) return false;
      }
      if (selectedOriginPane !== "all") {
        if (event.origin?.paneId !== selectedOriginPane) return false;
      }
      return true;
    }

    function getDeltaType(event) {
      return event.payload?.assistantMessageEvent?.type ?? "unknown";
    }

    function createGroupItem(run, deltaType) {
      const first = run[0];
      return {
        kind: "group",
        id: `group-${first.id}`,
        deltaType,
        events: run.slice(),
        startTimestamp: first.timestamp,
        endTimestamp: run[run.length - 1].timestamp,
        payloadSize: run.reduce((sum, e) => sum + e.payloadSize, 0),
        latency: first.latency,
        get summary() {
          return `message_update × ${this.events.length} (${this.deltaType})`;
        },
      };
    }

    function computeVisibleItems() {
      const filtered = allEvents.filter(eventMatchesFilters);
      if (!compactDeltas) {
        return filtered.map((e) => ({ kind: "event", id: e.id, event: e }));
      }

      const items = [];
      let run = [];
      let runType = null;

      function flushRun() {
        if (run.length >= 3) {
          items.push(createGroupItem(run, runType));
        } else {
          for (const e of run) items.push({ kind: "event", id: e.id, event: e });
        }
        run = [];
        runType = null;
      }

      for (const event of filtered) {
        if (event.type === "message_update") {
          const dt = getDeltaType(event);
          if (dt === runType) {
            run.push(event);
          } else {
            flushRun();
            run = [event];
            runType = dt;
          }
        } else {
          flushRun();
          items.push({ kind: "event", id: event.id, event: event });
        }
      }
      flushRun();
      return items;
    }

    function createEventRow(event) {
      const row = document.createElement("div");
      row.className = "event-row";
      row.dataset.category = event.category;
      row.dataset.id = event.id;
      if (expandedEventIds.has(event.id)) {
        row.classList.add("expanded");
      }

      const header = document.createElement("div");
      header.className = "event-header";
      header.innerHTML = `
        <span class="event-timestamp" title="${new Date(event.timestamp).toISOString()}">${formatTime(event.timestamp)}</span>
        ${originBadgeHtml(event)}
        <span class="event-latency" title="Time since previous event">${formatLatency(event.latency)}</span>
        <span class="event-category">${event.category}</span>
        <span class="event-type">${escapeHtml(event.type)}</span>
        <span class="event-summary">${escapeHtml(event.summary)}</span>
        <span class="event-size" title="Payload size">${formatBytes(event.payloadSize)}</span>
      `;

      header.addEventListener("click", () => {
        const payload = row.querySelector(".event-payload");
        row.classList.toggle("expanded");
        if (row.classList.contains("expanded")) {
          expandedEventIds.add(event.id);
          payload.style.display = "block";
          if (!payload.hasChildNodes()) {
            renderJsonPayload(payload, event.payload);
          }
        } else {
          expandedEventIds.delete(event.id);
          payload.style.display = "none";
        }
      });

      const payload = document.createElement("div");
      payload.className = "event-payload";
      payload.style.display = expandedEventIds.has(event.id) ? "block" : "none";
      if (expandedEventIds.has(event.id)) {
        renderJsonPayload(payload, event.payload);
      }

      row.appendChild(header);
      row.appendChild(payload);
      return row;
    }

    function renderGroupPayload(container, item) {
      container.innerHTML = "";
      for (const event of item.events) {
        const nested = createEventRow(event);
        nested.classList.add("nested-event");
        container.appendChild(nested);
      }
    }

    function createGroupRow(item) {
      const row = document.createElement("div");
      row.className = "event-row compact-group";
      row.dataset.id = item.id;
      if (expandedGroupIds.has(item.id)) {
        row.classList.add("expanded");
      }

      const header = document.createElement("div");
      header.className = "event-header";
      header.innerHTML = `
        <span class="event-timestamp" title="${new Date(item.startTimestamp).toISOString()} – ${new Date(item.endTimestamp).toISOString()}">${formatTime(item.startTimestamp)}–${formatTime(item.endTimestamp)}</span>
        ${originBadgeHtml(item.events[0])}
        <span class="event-latency" title="Time since previous event">${formatLatency(item.latency)}</span>
        <span class="event-category">prompt</span>
        <span class="event-type">message_update</span>
        <span class="event-summary">${escapeHtml(item.summary)}</span>
        <span class="event-size" title="Total payload size">${formatBytes(item.payloadSize)}</span>
        <button class="expand-btn" title="Expand/collapse deltas">${expandedGroupIds.has(item.id) ? "▾" : "▸"}</button>
      `;

      const toggle = (ev) => {
        if (ev && ev.target.closest(".expand-btn")) {
          ev.stopPropagation();
        }
        const payload = row.querySelector(".event-payload");
        row.classList.toggle("expanded");
        const expanded = row.classList.contains("expanded");
        if (expanded) {
          expandedGroupIds.add(item.id);
          payload.style.display = "block";
          renderGroupPayload(payload, item);
        } else {
          expandedGroupIds.delete(item.id);
          payload.style.display = "none";
        }
        const btn = header.querySelector(".expand-btn");
        if (btn) btn.textContent = expanded ? "▾" : "▸";
      };

      header.addEventListener("click", toggle);

      const payload = document.createElement("div");
      payload.className = "event-payload group-payload";
      payload.style.display = expandedGroupIds.has(item.id) ? "block" : "none";
      if (expandedGroupIds.has(item.id)) {
        renderGroupPayload(payload, item);
      }

      row.appendChild(header);
      row.appendChild(payload);
      return row;
    }

    function updateGroupElement(el, item) {
      const ts = el.querySelector(".event-timestamp");
      if (ts) ts.textContent = `${formatTime(item.startTimestamp)}–${formatTime(item.endTimestamp)}`;
      const summary = el.querySelector(".event-summary");
      if (summary) summary.textContent = item.summary;
      const size = el.querySelector(".event-size");
      if (size) size.textContent = formatBytes(item.payloadSize);
      const latency = el.querySelector(".event-latency");
      if (latency) latency.textContent = formatLatency(item.latency);
      const btn = el.querySelector(".expand-btn");
      if (btn) btn.textContent = expandedGroupIds.has(item.id) ? "▾" : "▸";

      const payload = el.querySelector(".event-payload");
      if (payload && payload.style.display === "block") {
        renderGroupPayload(payload, item);
      }
    }

    function createItemElement(item) {
      return item.kind === "group" ? createGroupRow(item) : createEventRow(item.event);
    }

    function updateItemElement(el, item) {
      if (item.kind === "group") {
        updateGroupElement(el, item);
      }
    }

    function renderTimeline() {
      const items = computeVisibleItems();
      const wantedIds = new Set(items.map((i) => i.id));

      for (const [id, el] of Array.from(itemElements.entries())) {
        if (!wantedIds.has(id)) {
          el.remove();
          itemElements.delete(id);
        }
      }

      for (const item of items) {
        let el = itemElements.get(item.id);
        if (!el) {
          el = createItemElement(item);
          itemElements.set(item.id, el);
        } else {
          updateItemElement(el, item);
        }
        timeline.appendChild(el);
      }

      if (items.length === 0) {
        emptyState.classList.remove("hidden");
      } else {
        emptyState.classList.add("hidden");
      }

      if (autoScroll && isNearBottom()) {
        scrollToBottom();
      } else {
        updateScrollHint();
      }
    }

    function scheduleRender() {
      if (renderScheduled) return;
      renderScheduled = true;
      requestAnimationFrame(() => {
        renderScheduled = false;
        renderTimeline();
      });
    }

    function updateCategoryCounts() {
      const counts = { session: 0, agent: 0, prompt: 0, tool: 0, provider: 0 };
      for (const event of allEvents) {
        counts[event.category] = (counts[event.category] || 0) + 1;
      }
      const total = allEvents.length;
      eventCountLabel.textContent = `${total} event${total === 1 ? "" : "s"}`;

      categoryCountsEl.innerHTML = "";
      for (const category of ["session", "agent", "prompt", "tool", "provider"]) {
        const span = document.createElement("span");
        span.className = "category-count";
        span.dataset.category = category;
        span.textContent = `${category} ${counts[category]}`;
        categoryCountsEl.appendChild(span);
      }
    }

    function renderTypeFilter() {
      typesList.innerHTML = "";
      const sorted = Array.from(typeCounts.keys()).sort();
      if (sorted.length === 0) {
        typesList.innerHTML = '<div class="type-empty">No events yet</div>';
        return;
      }
      for (const type of sorted) {
        const label = document.createElement("label");
        label.className = "type-option";
        const count = typeCounts.get(type) || 0;
        const checked = visibleTypes.has(type);
        label.innerHTML = `
          <input type="checkbox" value="${escapeHtml(type)}" ${checked ? "checked" : ""}>
          <span>${escapeHtml(type)}</span>
          <span class="type-count">${count}</span>
        `;
        const input = label.querySelector("input");
        input.addEventListener("change", () => {
          if (input.checked) {
            visibleTypes.add(type);
            hiddenTypes.delete(type);
          } else {
            visibleTypes.delete(type);
            hiddenTypes.add(type);
          }
          scheduleRender();
        });
        typesList.appendChild(label);
      }
    }

    function updateTypeCount(type) {
      const inputs = typesList.querySelectorAll('input[type="checkbox"]');
      for (const input of inputs) {
        if (input.value === type) {
          const countEl = input.closest(".type-option")?.querySelector(".type-count");
          if (countEl) countEl.textContent = typeCounts.get(type) || 0;
          break;
        }
      }
    }

    events.addEventListener("open", () => {
      setStatus("connected", "Connected — listening for events");
    });

    events.addEventListener("message", (event) => {
      try {
        const data = JSON.parse(event.data);
        const aug = augmentEvent(data);
        allEvents.push(aug);
        discoverType(aug.type);
        discoverOrigin(aug);
        updateHerdrIndicator(aug);
        updateCategoryCounts();
        scheduleRender();
      } catch (err) {
        console.warn("[agent-loop-debugger] Failed to parse event:", event.data, err);
      }
    });

    events.addEventListener("error", () => {
      if (events.readyState === EventSource.CONNECTING) {
        setStatus("connecting", "Reconnecting…");
      } else if (events.readyState === EventSource.CLOSED) {
        setStatus("error", "Connection lost");
      }
    });

    // Category toggles
    document.querySelectorAll(".category-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const category = btn.dataset.category;
        if (visibleCategories.has(category)) {
          visibleCategories.delete(category);
          btn.classList.add("hidden");
        } else {
          visibleCategories.add(category);
          btn.classList.remove("hidden");
        }
        scheduleRender();
      });
    });

    // Auto-scroll toggle
    autoscrollBtn.addEventListener("click", () => {
      autoScroll = !autoScroll;
      autoscrollBtn.textContent = `Auto-scroll: ${autoScroll ? "on" : "off"}`;
      autoscrollBtn.classList.toggle("active", !autoScroll);
      if (autoScroll) {
        scrollToBottom();
      }
      updateScrollHint();
    });

    // Search debounce
    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchQuery = searchInput.value.trim();
        scheduleRender();
      }, 150);
    });

    // Time range filter
    timeRangeSelect.addEventListener("change", () => {
      timeRange = timeRangeSelect.value;
      scheduleRender();
    });

    // Compact deltas toggle
    compactToggle.addEventListener("click", () => {
      compactDeltas = !compactDeltas;
      compactToggle.textContent = `Compact deltas: ${compactDeltas ? "on" : "off"}`;
      compactToggle.classList.toggle("active", compactDeltas);
      scheduleRender();
    });

    // Origin pane filter
    originFilter.addEventListener("change", () => {
      selectedOriginPane = originFilter.value;
      scheduleRender();
    });

    // Event types popover
    typesToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      typesPopover.classList.toggle("hidden");
    });

    document.addEventListener("click", (e) => {
      if (!typesPopover.contains(e.target) && e.target !== typesToggle) {
        typesPopover.classList.add("hidden");
      }
    });

    // Export
    function toExportEvent(event) {
      return {
        id: event.id,
        timestamp: event.timestamp,
        category: event.category,
        type: event.type,
        summary: event.summary,
        latency: event.latency,
        payloadSize: event.payloadSize,
        payload: event.payload,
      };
    }

    function toExportItem(item) {
      if (item.kind === "event") {
        return toExportEvent(item.event);
      }
      return {
        kind: "compact-group",
        count: item.events.length,
        type: "message_update",
        deltaType: item.deltaType,
        startTimestamp: item.startTimestamp,
        endTimestamp: item.endTimestamp,
        latency: item.latency,
        payloadSize: item.payloadSize,
        summary: item.summary,
        events: item.events.map(toExportEvent),
      };
    }

    function serializeEventHtml(event) {
      const payload = escapeHtml(JSON.stringify(event.payload, null, 2));
      const latency = escapeHtml(formatLatency(event.latency));
      return (
        '<div class="event-row" data-category="' + event.category + '">\n' +
        '  <div class="event-header">\n' +
        '    <span class="event-timestamp">' + escapeHtml(formatTime(event.timestamp)) + '</span>\n' +
        '    <span class="event-latency">' + latency + '</span>\n' +
        '    <span class="event-category">' + event.category + '</span>\n' +
        '    <span class="event-type">' + escapeHtml(event.type) + '</span>\n' +
        '    <span class="event-summary">' + escapeHtml(event.summary) + '</span>\n' +
        '    <span class="event-size">' + escapeHtml(formatBytes(event.payloadSize)) + '</span>\n' +
        '  </div>\n' +
        '  <div class="event-payload" style="display:none;"><pre>' + payload + '</pre></div>\n' +
        '</div>'
      );
    }

    function serializeGroupHtml(item) {
      const eventsHtml = item.events.map(serializeEventHtml).join("\n");
      const latency = escapeHtml(formatLatency(item.latency));
      return (
        '<div class="event-row compact-group">\n' +
        '  <div class="event-header">\n' +
        '    <span class="event-timestamp">' + escapeHtml(formatTime(item.startTimestamp)) + "–" + escapeHtml(formatTime(item.endTimestamp)) + '</span>\n' +
        '    <span class="event-latency">' + latency + '</span>\n' +
        '    <span class="event-category">prompt</span>\n' +
        '    <span class="event-type">message_update</span>\n' +
        '    <span class="event-summary">' + escapeHtml(item.summary) + '</span>\n' +
        '    <span class="event-size">' + escapeHtml(formatBytes(item.payloadSize)) + '</span>\n' +
        '    <button class="expand-btn">▸</button>\n' +
        '  </div>\n' +
        '  <div class="event-payload group-payload" style="display:none;">\n' + eventsHtml + '\n  </div>\n' +
        '</div>'
      );
    }

    function generateHtmlExport(items) {
      const rows = items.map((item) => {
        return item.kind === "group" ? serializeGroupHtml(item) : serializeEventHtml(item.event);
      }).join("\n");

      return (
        '<!DOCTYPE html>\n' +
        '<html lang="en">\n' +
        '<head>\n' +
        '  <meta charset="UTF-8">\n' +
        '  <title>Agent Loop Debugger Export</title>\n' +
        '  <style>' + document.querySelector("style").textContent + '</style>\n' +
        '</head>\n' +
        '<body>\n' +
        '  <header>\n' +
        '    <div class="title">Agent Loop Debugger Export</div>\n' +
        '    <div class="controls">\n' +
        '      <span style="color:var(--text-muted);font-size:0.8rem;">' + escapeHtml(new Date().toISOString()) + " · " + items.length + ' items</span>\n' +
        '    </div>\n' +
        '  </header>\n' +
        '  <div id="timeline" style="height:auto;overflow:visible;padding:1.25rem;">\n' + rows + '\n  </div>\n' +
        '  <script>\n' +
        '    document.addEventListener("click", function(e) {\n' +
        '      var header = e.target.closest(".event-header");\n' +
        '      if (!header) return;\n' +
        '      var row = header.closest(".event-row");\n' +
        '      var payload = row.querySelector(".event-payload");\n' +
        '      if (!payload) return;\n' +
        '      var expanded = payload.style.display === "block";\n' +
        '      payload.style.display = expanded ? "none" : "block";\n' +
        '      row.classList.toggle("expanded", !expanded);\n' +
        '      var btn = header.querySelector(".expand-btn");\n' +
        '      if (btn) btn.textContent = expanded ? "▸" : "▾";\n' +
        '    });\n' +
        '  </scr' + 'ipt>\n' +
        '</body>\n' +
        '</html>'
      );
    }

    function generateMarkdownExport(items) {
      const lines = [
        "# Agent Loop Debugger Export",
        "",
        `Exported ${new Date().toISOString()} — ${items.length} visible items.`,
        "",
        "| Time | Category | Type | Summary |",
        "|------|----------|------|---------|",
      ];
      for (const item of items) {
        let time, category, type, summary;
        if (item.kind === "event") {
          const e = item.event;
          time = formatTime(e.timestamp);
          category = e.category;
          type = escapeMd(e.type);
          summary = escapeMd(e.summary);
        } else {
          time = `${formatTime(item.startTimestamp)}–${formatTime(item.endTimestamp)}`;
          category = "prompt";
          type = escapeMd(`message_update × ${item.events.length} (${item.deltaType})`);
          summary = escapeMd(item.summary);
        }
        lines.push(`| ${time} | ${category} | ${type} | ${summary} |`);
      }
      return lines.join("\n");
    }

    function download(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    exportBtn.addEventListener("click", async () => {
      try {
        const res = await fetch("/api/events");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // Re-hydrate with the same derived metadata used by the UI.
        const hydrated = [];
        for (let i = 0; i < data.length; i++) {
          const event = data[i];
          let payloadString;
          try {
            payloadString = JSON.stringify(event.payload);
          } catch {
            payloadString = "";
          }
          const payloadSize = new TextEncoder().encode(payloadString).length;
          const latency = i > 0 ? event.timestamp - data[i - 1].timestamp : null;
          hydrated.push({ ...event, _payloadString: payloadString, payloadSize, latency });
        }

        const exportAnchor = hydrated.length > 0 ? hydrated[hydrated.length - 1].timestamp : Date.now();
        const filtered = hydrated.filter((e) => eventMatchesFilters(e, exportAnchor));
        const items = (() => {
          if (!compactDeltas) return filtered.map((e) => ({ kind: "event", id: e.id, event: e }));
          const out = [];
          let run = [];
          let runType = null;
          function flush() {
            if (run.length >= 3) out.push(createGroupItem(run, runType));
            else for (const e of run) out.push({ kind: "event", id: e.id, event: e });
            run = [];
            runType = null;
          }
          for (const event of filtered) {
            if (event.type === "message_update") {
              const dt = getDeltaType(event);
              if (dt === runType) run.push(event);
              else { flush(); run = [event]; runType = dt; }
            } else {
              flush();
              out.push({ kind: "event", id: event.id, event: event });
            }
          }
          flush();
          return out;
        })();

        const ts = new Date().toISOString().replace(/[:.]/g, "-");
        const format = exportFormat.value;

        if (format === "json") {
          const payload = items.map(toExportItem);
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          download(blob, `agent-loop-trace-${ts}.json`);
        } else if (format === "html") {
          const html = generateHtmlExport(items);
          const blob = new Blob([html], { type: "text/html" });
          download(blob, `agent-loop-trace-${ts}.html`);
        } else if (format === "markdown") {
          const md = generateMarkdownExport(items);
          const blob = new Blob([md], { type: "text/markdown" });
          download(blob, `agent-loop-trace-${ts}.md`);
        }
      } catch (err) {
        console.error("[agent-loop-debugger] Export failed:", err);
        alert("Export failed: " + err.message);
      }
    });

    // Clear display
    clearBtn.addEventListener("click", () => {
      allEvents.length = 0;
      itemElements.forEach((el) => el.remove());
      itemElements.clear();
      expandedEventIds.clear();
      expandedGroupIds.clear();
      visibleTypes.clear();
      typeCounts.clear();
      discoveredPaneIds.clear();
      selectedOriginPane = "all";
      originFilter.innerHTML = '<option value="all">All origins</option>';
      originFilter.classList.remove("visible");
      herdrIndicator.classList.remove("visible");
      renderTypeFilter();
      updateCategoryCounts();
      emptyState.classList.remove("hidden");
      updateScrollHint();
    });

    // Scroll hint click
    scrollHint.addEventListener("click", () => {
      autoScroll = true;
      autoscrollBtn.textContent = "Auto-scroll: on";
      autoscrollBtn.classList.remove("active");
      scrollToBottom();
      updateScrollHint();
    });

    // Pause auto-scroll when user scrolls up manually
    timeline.addEventListener("scroll", () => {
      if (timeline.scrollHeight !== lastScrollHeight) {
        updateScrollHint();
      }
    });

    // Trace loader
    async function fetchTraces() {
      try {
        const res = await fetch("/api/traces");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        console.error("[agent-loop-debugger] Failed to fetch traces:", err);
        return [];
      }
    }

    function renderTracesList(traces) {
      tracesList.innerHTML = "";
      if (!Array.isArray(traces) || traces.length === 0) {
        tracesList.innerHTML = '<div class="trace-empty">No saved traces</div>';
        return;
      }
      for (const trace of traces) {
        const btn = document.createElement("button");
        btn.className = "trace-option";
        const when = new Date(trace.createdAt).toISOString();
        btn.innerHTML = `
          <span class="trace-name">${escapeHtml(trace.filename)}</span>
          <span class="trace-meta">${escapeHtml(when)} · ${trace.eventCount} events</span>
        `;
        btn.addEventListener("click", () => loadTrace(trace.filename));
        tracesList.appendChild(btn);
      }
    }

    async function refreshTraces() {
      const traces = await fetchTraces();
      renderTracesList(traces);
    }

    async function loadTrace(filename) {
      try {
        const res = await fetch(`/api/traces/${encodeURIComponent(filename)}`, { method: "POST" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        tracesPopover.classList.add("hidden");
        setStatus("connected", `Loaded trace ${filename} (${data.loaded} events)`);
        setTimeout(() => setStatus("connected", "Connected — listening for events"), 2500);
      } catch (err) {
        console.error("[agent-loop-debugger] Failed to load trace:", err);
        alert("Failed to load trace: " + err.message);
      }
    }

    tracesToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      refreshTraces();
      tracesPopover.classList.toggle("hidden");
    });

    document.addEventListener("click", (e) => {
      if (!tracesPopover.contains(e.target) && e.target !== tracesToggle) {
        tracesPopover.classList.add("hidden");
      }
    });

    // State inspector
    let stateRefreshTimer = null;

    function openStatePanel() {
      statePanel.classList.remove("hidden");
      stateBackdrop.classList.add("visible");
      stateToggle.classList.add("active");
      refreshState();
      if (!stateRefreshTimer) {
        stateRefreshTimer = setInterval(refreshState, 2000);
      }
    }

    function closeStatePanel() {
      statePanel.classList.add("hidden");
      stateBackdrop.classList.remove("visible");
      stateToggle.classList.remove("active");
      if (stateRefreshTimer) {
        clearInterval(stateRefreshTimer);
        stateRefreshTimer = null;
      }
    }

    stateToggle.addEventListener("click", () => {
      if (statePanel.classList.contains("hidden")) {
        openStatePanel();
      } else {
        closeStatePanel();
      }
    });

    stateClose.addEventListener("click", closeStatePanel);
    stateBackdrop.addEventListener("click", closeStatePanel);

    stateTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        stateTabs.forEach((t) => t.classList.remove("active"));
        statePanes.forEach((p) => p.classList.remove("active"));
        tab.classList.add("active");
        const pane = document.getElementById(`state-pane-${tab.dataset.tab}`);
        if (pane) pane.classList.add("active");
      });
    });

    copySystemPrompt.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(systemPromptText.textContent);
        const original = copySystemPrompt.textContent;
        copySystemPrompt.textContent = "Copied";
        setTimeout(() => (copySystemPrompt.textContent = original), 1200);
      } catch (err) {
        console.error("[agent-loop-debugger] Copy failed:", err);
      }
    });

    async function refreshState() {
      try {
        const [promptRes, toolsRes, contextRes] = await Promise.all([
          fetch("/api/state/system-prompt"),
          fetch("/api/state/tools"),
          fetch("/api/state/context"),
        ]);

        if (promptRes.ok) {
          const data = await promptRes.json();
          systemPromptText.textContent = data.systemPrompt || "No system prompt captured yet.";
        }

        if (toolsRes.ok) {
          const tools = await toolsRes.json();
          toolsList.innerHTML = "";
          if (!Array.isArray(tools) || tools.length === 0) {
            toolsList.innerHTML = '<li class="trace-empty">No tool information available.</li>';
          } else {
            for (const tool of tools) {
              const li = document.createElement("li");
              li.className = "tool-item";
              const badgeClass = tool.active ? "tool-badge" : "tool-badge inactive";
              const badgeText = tool.active ? "active" : "inactive";
              li.innerHTML = `
                <span class="tool-name">${escapeHtml(tool.name)} <span class="${badgeClass}">${badgeText}</span></span>
                <p class="tool-desc">${escapeHtml(tool.description || "No description.")}</p>
              `;
              toolsList.appendChild(li);
            }
          }
        }

        if (contextRes.ok) {
          const usage = await contextRes.json();
          contextTokens.textContent = usage.tokens == null ? "—" : usage.tokens.toLocaleString();
          contextWindow.textContent = usage.contextWindow ? usage.contextWindow.toLocaleString() : "—";
          contextPercent.textContent = usage.percent == null ? "—" : `${Math.round(usage.percent)}%`;
          const pct = usage.percent == null ? 0 : Math.max(0, Math.min(100, usage.percent));
          contextProgress.style.width = `${pct}%`;
        }
      } catch (err) {
        console.error("[agent-loop-debugger] Failed to refresh state:", err);
      }
    }

    // Keyboard shortcut: space toggles auto-scroll
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target === document.body) {
        e.preventDefault();
        autoscrollBtn.click();
      }
    });
  </script>
</body>
</html>
